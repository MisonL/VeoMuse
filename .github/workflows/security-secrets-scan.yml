name: CI · Security Secrets Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  repo-guard:
    name: Bun Secrets Guard
    runs-on: ubuntu-latest
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run lightweight scan
        run: bun run security:scan

  gitleaks:
    name: Gitleaks Deep Scan
    runs-on: ubuntu-latest
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}:/repo" \
            zricethezav/gitleaks:v8.30.1 detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --report-format=sarif \
              --report-path=/repo/gitleaks.sarif \
              --redact \
              --exit-code=1 \
              --no-banner

      - name: Upload SARIF
        if: ${{ always() && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
